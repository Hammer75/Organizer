<script>
    document.addEventListener('DOMContentLoaded', () => {
        
        // --- 1. GENEROWANIE SPIRALI (Kółka kołonotatnika) ---
        const spiralContainer = document.getElementById('spiral-binding');
        // Tworzymy 17 kółek
        let spiralHTML = '';
        for(let i = 0; i < 17; i++) {
            spiralHTML += `
                <div class="ring-group">
                    <div class="hole"></div>
                    <div class="ring"></div>
                </div>
            `;
        }
        spiralContainer.innerHTML = spiralHTML;

        // --- 2. OBSŁUGA ZAKŁADEK ---
        const tabs = document.querySelectorAll('.tab');
        const views = document.querySelectorAll('.view-content');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                views.forEach(v => v.classList.remove('active'));
                tab.classList.add('active');
                const targetId = tab.getAttribute('data-target');
                const targetView = document.getElementById(targetId);
                if (targetView) {
                    setTimeout(() => targetView.classList.add('active'), 20);
                }
            });
        });

        // --- 3. LOGIKA KALENDARZA I ANIMACJI 3D SWIPE ---
        const monthNames = ["Styczeń", "Luty", "Marzec", "Kwiecień", "Maj", "Czerwiec", "Lipiec", "Sierpień", "Wrzesień", "Październik", "Listopad", "Grudzień"];
        let currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();

        // Zmieniony klucz w LocalStorage dla nowej struktury danych (tablice obiektów)
        let appointments = JSON.parse(localStorage.getItem('organizer_appointments_v2')) || {};
        
        function getFormatDate(y, m, d) {
            return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        }
        
        // Domślnie zaznaczamy dzisiejszy dzień
        let selectedDate = getFormatDate(currentYear, currentMonth, currentDate.getDate());

        const calBase = document.getElementById('cal-base');
        const calFlipper = document.getElementById('cal-flipper');
        const calFront = document.getElementById('cal-front');
        const calBack = document.getElementById('cal-back');
        const viewKalendarz = document.getElementById('view-kalendarz');

        // Funkcja renderująca HTML danego miesiąca
        function generateMonthHTML(month, year) {
            let firstDay = new Date(year, month, 1).getDay();
            firstDay = firstDay === 0 ? 6 : firstDay - 1; // Konwersja na Pn=0
            let daysInMonth = new Date(year, month + 1, 0).getDate();

            let html = `<h2 class="handwriting calendar-header">${monthNames[month]} ${year}</h2>`;
            html += `<div class="swipe-hint">← Przesuń kartkę, aby zmienić miesiąc →</div>`;
            html += `<div class="calendar-grid font-sans">
                    <div class="calendar-day-header">Pn</div><div class="calendar-day-header">Wt</div>
                    <div class="calendar-day-header">Śr</div><div class="calendar-day-header">Cz</div>
                    <div class="calendar-day-header">Pt</div><div class="calendar-day-header">Sb</div>
                    <div class="calendar-day-header">Nd</div>`;

            // Puste pola przed 1. dniem
            for (let i = 0; i < firstDay; i++) {
                html += `<div></div>`;
            }

            let today = new Date();
            for (let d = 1; d <= daysInMonth; d++) {
                let dateStr = getFormatDate(year, month, d);
                let isToday = (d === today.getDate() && month === today.getMonth() && year === today.getFullYear());
                let isSelected = (dateStr === selectedDate);
                
                let cls = "calendar-day handwriting";
                if (isSelected) cls += " selected";
                else if (isToday) cls += " today";
                
                html += `<div class="${cls}" data-date="${dateStr}">${d}</div>`;
            }
            html += `</div>`;
            
            // Generowanie interaktywnego harmonogramu dla wybranego dnia
            html += `<div class="schedule-container">
                     <h3 class="handwriting" style="font-size: 18px; margin-bottom: 10px; color: #7f8c8d;">Harmonogram</h3>
                     <div class="schedule-list">`;
            
            // Pobranie i sortowanie wpisów
            let dayEvents = appointments[selectedDate] || [];
            if (!Array.isArray(dayEvents)) dayEvents = []; // Zabezpieczenie danych
            
            // Sortowanie chronologiczne po godzinie rozpoczęcia
            dayEvents.sort((a, b) => a.start.localeCompare(b.start));

            if (dayEvents.length === 0) {
                html += `<div class="handwriting" style="color: rgba(0,0,0,0.3); font-size: 15px; text-align: center; margin-top: 10px;">Brak zaplanowanych zadań</div>`;
            } else {
                dayEvents.forEach((ev, index) => {
                    let timeStr = ev.end ? `${ev.start} - ${ev.end}` : ev.start;
                    html += `<div class="event-row handwriting">
                                <span class="event-time font-sans">${timeStr}</span>
                                <span class="event-desc">${ev.desc}</span>
                                <button class="delete-btn" data-date="${selectedDate}" data-index="${index}">×</button>
                             </div>`;
                });
            }
            html += `</div>`; // koniec .schedule-list
            
            // Formularz dodawania nowego wpisu
            html += `<div class="add-event-form">
                        <input type="time" id="new-event-start" required title="Godzina od">
                        <span style="font-size:12px; color: #7f8c8d;">-</span>
                        <input type="time" id="new-event-end" title="Godzina do">
                        <input type="text" id="new-event-desc" placeholder="Opis zajęcia..." required>
                        <button class="add-btn" id="add-event-btn">Dodaj</button>
                     </div>`;
                     
            html += `</div>`; // koniec .schedule-container
                     
            return html;
        }

        // Inicjalizacja domyślnego widoku kalendarza
        calBase.innerHTML = generateMonthHTML(currentMonth, currentYear);

        // Zmienne do swipe
        let isDragging = false;
        let startX = null;
        let startY = null;
        let currentRotY = 0;
        let flipDirection = null; // 'next' lub 'prev'

        // Funkcja pobierająca dane miesiąca po dodaniu offsetu (np. +1, -1)
        function getMonthOffset(offset) {
            let d = new Date(currentYear, currentMonth + offset, 1);
            return { month: d.getMonth(), year: d.getFullYear() };
        }

        // Przygotowanie DOM do animacji obrócenia kartki
        function setupFlipState(direction) {
            calFlipper.style.display = 'block';
            calFlipper.style.transition = 'none';

            if (direction === 'next') {
                // Pokazujemy bieżący na wierzchu animowanej kartki, pod spodem ładujemy następny
                calFront.innerHTML = generateMonthHTML(currentMonth, currentYear);
                let next = getMonthOffset(1);
                calBase.innerHTML = generateMonthHTML(next.month, next.year);
                currentRotY = 0;
                calFlipper.style.transform = `rotateY(0deg)`;
            } else {
                // Tworzymy iluzję, że wyciągamy starą kartkę z lewej strony
                let prev = getMonthOffset(-1);
                calFront.innerHTML = generateMonthHTML(prev.month, prev.year);
                calBase.innerHTML = generateMonthHTML(currentMonth, currentYear);
                currentRotY = -180;
                calFlipper.style.transform = `rotateY(-180deg)`;
            }
        }

        function onPointerDown(e) {
            // Zablokuj swipe, jeśli użytkownik chce skupić pole tekstowe w harmonogramie
            if (e.target.tagName.toLowerCase() === 'input') return;

            // Ignoruj jeśli już w trakcie animacji lub nie w kalendarzu
            if(!viewKalendarz.classList.contains('active')) return; 
            
            startX = e.clientX || (e.touches && e.touches[0].clientX);
            startY = e.clientY || (e.touches && e.touches[0].clientY);
            isDragging = true;
            flipDirection = null;
            
            viewKalendarz.style.cursor = 'grabbing';
            
            document.addEventListener('mousemove', onPointerMove, {passive: false});
            document.addEventListener('mouseup', onPointerUp);
            document.addEventListener('touchmove', onPointerMove, {passive: false});
            document.addEventListener('touchend', onPointerUp);
        }

        function onPointerMove(e) {
            if (!isDragging || startX === null) return;
            
            let x = e.clientX || (e.touches && e.touches[0].clientX);
            let y = e.clientY || (e.touches && e.touches[0].clientY);
            let diffX = x - startX;
            let diffY = Math.abs(y - startY);

            // Wykrycie intencji kierunku przy pierwszym konkretnym ruchu
            if (flipDirection === null) {
                if (Math.abs(diffX) > 15 && Math.abs(diffX) > diffY) {
                    flipDirection = diffX < 0 ? 'next' : 'prev';
                    setupFlipState(flipDirection);
                } else if (diffY > 15) {
                    // Ruch pionowy (np. scroll), anulujemy swipe
                    cleanupListeners();
                    return; 
                } else {
                    return; // Czekamy aż przebije próg 15px
                }
            }

            if(e.cancelable) e.preventDefault(); // Zablokowanie natywnego powrotu (back) na iOS/Android

            // Obliczenie rotacji 3D (-180st do 0st)
            let maxSwipe = window.innerWidth / 1.5; 
            if (flipDirection === 'next') {
                // diffX ujemne
                currentRotY = Math.max(-180, Math.min(0, (diffX / maxSwipe) * 180));
            } else {
                // diffX dodatnie
                currentRotY = Math.max(-180, Math.min(0, -180 + (diffX / maxSwipe) * 180));
            }
            
            calFlipper.style.transform = `rotateY(${currentRotY}deg)`;
        }

        function onPointerUp(e) {
            if (!isDragging) return;
            
            if (flipDirection === null) {
                cleanupListeners();
                return;
            }

            // Animacja dokończenia ruchu
            calFlipper.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1)';
            
            let threshold = 60; // Próg w stopniach do uznania przewrócenia kartki
            let targetRot = 0;
            let didFlip = false;

            if (flipDirection === 'next') {
                if (currentRotY < -threshold) { targetRot = -180; didFlip = true; }
                else targetRot = 0;
            } else {
                if (currentRotY > -180 + threshold) { targetRot = 0; didFlip = true; }
                else targetRot = -180;
            }

            calFlipper.style.transform = `rotateY(${targetRot}deg)`;
            
            // Czekamy na koniec animacji CSS
            calFlipper.addEventListener('transitionend', function handler() {
                calFlipper.removeEventListener('transitionend', handler);
                finalizeFlip(didFlip, flipDirection);
            });

            cleanupListeners();
        }

        function finalizeFlip(didFlip, direction) {
            calFlipper.style.display = 'none';
            calFlipper.style.transition = 'none';

            if (didFlip) {
                if (direction === 'next') {
                    let next = getMonthOffset(1);
                    currentMonth = next.month; currentYear = next.year;
                } else {
                    let prev = getMonthOffset(-1);
                    currentMonth = prev.month; currentYear = prev.year;
                }
                
                // Po zmianie miesiąca automatycznie przeskakujemy na pierwszy dzień, 
                // lub na dzień dzisiejszy, jeśli wracamy do aktualnego miesiąca.
                let today = new Date();
                if (currentMonth === today.getMonth() && currentYear === today.getFullYear()) {
                    selectedDate = getFormatDate(currentYear, currentMonth, today.getDate());
                } else {
                    selectedDate = getFormatDate(currentYear, currentMonth, 1);
                }
            }
            
            calBase.innerHTML = generateMonthHTML(currentMonth, currentYear);
            flipDirection = null;
        }

        function cleanupListeners() {
            isDragging = false;
            startX = null; startY = null;
            viewKalendarz.style.cursor = 'grab';
            document.removeEventListener('mousemove', onPointerMove);
            document.removeEventListener('mouseup', onPointerUp);
            document.removeEventListener('touchmove', onPointerMove);
            document.removeEventListener('touchend', onPointerUp);
        }

        // Inicjalizacja Eventów dla myszy i dotyku
        viewKalendarz.style.cursor = 'grab';
        viewKalendarz.addEventListener('mousedown', onPointerDown);
        viewKalendarz.addEventListener('touchstart', onPointerDown, {passive: false});
        // Zapobieganie domyślnemu zaznaczaniu tekstu przy dragowaniu
        viewKalendarz.addEventListener('dragstart', e => {
            if (e.target.tagName.toLowerCase() !== 'input') e.preventDefault();
        });
        
        // Obsługa interakcji w Kalendarzu (wybór dnia, dodawanie i usuwanie zadań)
        viewKalendarz.addEventListener('click', (e) => {
            // Wybór dnia
            if (e.target.classList.contains('calendar-day') && e.target.dataset.date) {
                selectedDate = e.target.dataset.date;
                calBase.innerHTML = generateMonthHTML(currentMonth, currentYear);
                return;
            }

            // Dodawanie nowego zadania
            if (e.target.id === 'add-event-btn') {
                let startInput = document.getElementById('new-event-start');
                let endInput = document.getElementById('new-event-end');
                let descInput = document.getElementById('new-event-desc');
                
                if (!startInput.value || !descInput.value.trim()) {
                    // Wymagamy minimum godziny rozpoczęcia i opisu (pomijamy natrętne alerty)
                    return; 
                }

                let newEvent = {
                    start: startInput.value,
                    end: endInput.value,
                    desc: descInput.value.trim().replace(/</g, "&lt;").replace(/>/g, "&gt;") // podstawowa sanityzacja
                };

                if (!Array.isArray(appointments[selectedDate])) {
                    appointments[selectedDate] = [];
                }
                
                appointments[selectedDate].push(newEvent);
                localStorage.setItem('organizer_appointments_v2', JSON.stringify(appointments));
                
                // Odświeżenie widoku (uruchomi automatyczne sortowanie)
                calBase.innerHTML = generateMonthHTML(currentMonth, currentYear);
                return;
            }

            // Usuwanie zadania
            if (e.target.classList.contains('delete-btn')) {
                let date = e.target.dataset.date;
                let index = e.target.dataset.index;
                
                if (appointments[date]) {
                    appointments[date].splice(index, 1);
                    localStorage.setItem('organizer_appointments_v2', JSON.stringify(appointments));
                    calBase.innerHTML = generateMonthHTML(currentMonth, currentYear);
                }
            }
        });
    });
</script>
